  <!-- Typography -->
  <text x="64" y="24" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0A2540" letter-spacing="0.5">BHUBANESWAR</text>
  <text x="64" y="38" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0066CC" letter-spacing="1.2">ENGINEERING COLLEGE</text>
  <text x="64" y="49" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" letter-spacing="0.4">ACCOUNTS &amp; FINANCE MANAGEMENT</text>
